<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Exemplo arrow function</h1>

    <button id="btnMensagem">Clique aqui!</button>

    <script>
        document.querySelector("#btnMensagem").onclick = () => {
            alert("Mensagem")
        }
    </script>
</body>
</html>
